services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safety_app
      POSTGRES_PASSWORD: safety_app_local
      POSTGRES_DB: safety_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safety_app"]
      interval: 2s
      retries: 20

  server:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
      - ./recordings:/app/recordings
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://safety_app:safety_app_local@db:5432/safety_system
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        pip install -r requirements.txt &&
        python Tools/reset_database.py --scenario dev --video-dir recordings || python Tools/seed_demo.py --scenario dev &&
        python -m Sources.main --host 0.0.0.0 --port 8080 --auto-start-cameras
      "

volumes:
  pgdata:
